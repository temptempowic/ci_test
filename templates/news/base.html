<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AllNews - Latest News Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .navbar-brand { font-weight: 700; font-size: 1.5rem; }
        .hero-section { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4rem 2rem;
            margin-bottom: 2rem;
            border-radius: 0.5rem;
        }
        .news-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            border-radius: 0.5rem;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }
        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .news-card img {
            height: 200px;
            object-fit: cover;
        }
        .news-card .card-body {
            padding: 1.5rem;
        }
        .category-badge {
            background: #e0e7ff;
            color: #667eea;
            font-weight: 600;
        }
        .featured-article {
            border-left: 4px solid #667eea;
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 0.5rem;
        }
        .sidebar {
            position: sticky;
            top: 20px;
        }
        .footer {
            background: #2c3e50;
            color: white;
            padding: 2rem 0;
            margin-top: 3rem;
        }
        .badge-category {
            background: #667eea;
            color: white;
            font-size: 0.75rem;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .author-info {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        .author-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 0.75rem;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .meta {
            color: #6c757d;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .read-more {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .read-more:hover {
            color: #764ba2;
        }
        @media (max-width: 768px) {
            .sidebar {
                position: static;
                margin-top: 2rem;
            }
            .hero-section {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/news/">
                <i class="bi bi-newspaper"></i> AllNews
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/news/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/news/articles/">Articles</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/">Admin</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5><i class="bi bi-newspaper"></i> AllNews</h5>
                    <p>Your source for the latest news and stories.</p>
                </div>
                <div class="col-md-3">
                    <h6>Quick Links</h6>
                    <ul class="list-unstyled">
                        <li><a href="/news/" class="text-light text-decoration-none">Home</a></li>
                        <li><a href="/news/articles/" class="text-light text-decoration-none">Articles</a></li>
                        <li><a href="/admin/" class="text-light text-decoration-none">Admin</a></li>
                    </ul>
                </div>
                <div class="col-md-3">
                    <h6>Follow Us</h6>
                    <div>
                        <i class="bi bi-facebook me-2"></i>
                        <i class="bi bi-twitter-x me-2"></i>
                        <i class="bi bi-instagram me-2"></i>
                        <i class="bi bi-linkedin me-2"></i>
                    </div>
                </div>
            </div>
            <hr class="my-3 border-light">
            <p class="text-center">&copy; 2026 AllNews. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
